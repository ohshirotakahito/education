<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WORDMARK | 英単語トレーナー</title><link rel="stylesheet" href="styles.css"></head><body><main class="app-shell"><header class="topbar"><a class="brand" href="#"><span class="brand-mark">W</span><span>WORDMARK</span></a><div class="streak"><strong id="streak-count">0</strong> day streak</div></header><section class="intro"><div><p class="eyebrow">VOCABULARY LAB / SESSION 01</p><h1>Today's words<span>.</span></h1><p class="subtitle">思い出すことで、記憶を強くする。</p></div><button class="add-button" id="open-add">＋ 単語を追加</button></section><section class="stats"><div class="stat"><span class="stat-label">TODAY</span><strong id="today-count">0</strong><span class="stat-note"> / <span id="total-count">0</span> words</span></div><div class="stat"><span class="stat-label">MASTERED</span><strong id="mastered-count">0</strong><span class="stat-note"> words</span></div><div class="progress-stat"><div class="progress-copy"><span class="stat-label">SESSION PROGRESS</span><strong id="progress-label">0%</strong></div><div class="progress-track"><span id="progress-bar"></span></div></div></section><section class="study-layout"><div class="study-column"><div class="deck-toolbar"><div class="filter-tabs"><button class="filter-tab active" data-filter="all">ALL <span id="all-count">0</span></button><button class="filter-tab" data-filter="review">REVIEW <span id="review-count">0</span></button><button class="filter-tab" data-filter="mastered">MASTERED <span id="mastered-tab-count">0</span></button></div><button class="shuffle-button" id="shuffle-button">↻ <span>SHUFFLE</span></button></div><article class="flashcard"><div class="card-top"><span class="category-label" id="card-category"></span><span class="card-number" id="card-number"></span></div><div class="card-content"><p class="word" id="card-word"></p><p class="pronunciation" id="card-pronunciation"></p><div class="answer" id="card-answer" hidden><div class="meaning" id="card-meaning"></div><p class="example" id="card-example"></p></div><button class="reveal-button" id="reveal-button">答えを見る <span>SPACE</span></button></div><div class="card-footer"><span id="card-level">NEW WORD</span><span class="keyboard-hint">1 わかった　2 復習</span></div></article><div class="rating-actions" id="rating-actions" hidden><button class="rating-button review-button" data-rating="review"><div><strong>もう一度</strong><small>要復習</small></div></button><button class="rating-button mastered-button" data-rating="mastered"><div><strong>覚えた</strong><small>マスター</small></div></button></div></div><aside class="word-list"><div class="list-heading"><span>YOUR DECK</span><span id="deck-total"></span></div><label class="search-box"><input id="search-input" type="search" placeholder="単語を検索"></label><div class="list-items" id="list-items"></div></aside></section></main><dialog id="add-dialog"><form method="dialog" id="add-form"><div class="dialog-heading"><h2>単語を追加</h2><button value="cancel" class="close-button">×</button></div><label>英単語<input name="word" required></label><label>意味<input name="meaning" required></label><label>発音<input name="pronunciation"></label><label>例文<input name="example"></label><label>カテゴリー<input name="category" value="GENERAL"></label><button class="save-button" value="default">デッキに追加</button></form></dialog><script src="words-data.js"></script><script src="app.js"></script></body></html>
